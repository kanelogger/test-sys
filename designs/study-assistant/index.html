    <!--
  设计依据与假设（Step 3 / H-03，baoyu-design）
  - 事实来源：需求方案.md v2.6、CONTEXT.md 领域词汇、public/data/study-plan.seed.json（真实 seed 全量内嵌，
    135 计划项 / 48 天 / 15 资源）、docs/agents/workflow-state.md 的 FLOW-01 契约与 PROTO-01 移动链结论。
  - 范围：PC 侧栏五页（今日/计划/记录/历史/资源）+ 备份导出导入。重点闭环「今日 → 填实际分钟与总结 → 完成」、
    逾期待处理三入口、完成标准直接展示、资源入口（网页跳转 / 本地 PDF 仅复制文件名）。
  - 口径：今日预算 X 仅计今天 pending+completed 的 plannedMinutes，排除 moved/skipped 与未移入今天的逾期项；
    Y = settings.defaultDailyMinutes（通用参考线，不按星期切换）。考试剩余天数按本地日历日差计算。
  - 反馈：所有写操作模拟事务延迟（提交中禁用 + 防重复点击）；提交时在"事务内"重读状态，
    旧标签页/并发过期操作返回 STATE_CHANGED 并保留输入；新建补录用固定草稿 ID 判重（DUPLICATE_SUBMISSION）。
  - 补录两路径：先选历史日期的已有 pending（只填日志，日志日期=计划日，即"补记"）；
    系统无对应任务时才显示新建补录字段（source=backfill，任务+日志同次提交）。"补做"须先移动再完成。
  - 状态清单面板列出计划/移动/跳过/设置/日志编辑/历史/资源/备份的待拆票状态，票据归属为建议，Step 4 确认。
  - 技术：单文件自包含原型；无后端、无 CDN；状态存 localStorage（演示持久化），生产实现为 IndexedDB 事务。
    lucide 图标内联（ISC 许可）。演示日期 = 查看当天本地日期（2026-09-07 时逾期为 9/6 的 6 项）。
-->

          '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M10 16h4"/><path d="M12 14v4"/>',
        flask:
          '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
      };
      function ic(name, size) {
        return (
          '<svg class="ic" width="' +
          (size || 14) +
          '" height="' +
          (size || 14) +
          '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          ICON_PATHS[name] +
          "</svg>"
        );
      }

      /* ================= 工具 ================= */
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      function pad(n) {
        return String(n).padStart(2, "0");
      }
      function parseD(s) {
        const p = s.split("-");
        return { y: +p[0], m: +p[1], d: +p[2] };
      }
      function toStr(y, m, d) {
        return y + "-" + pad(m) + "-" + pad(d);
      }
      function addDays(s, n) {
        const p = parseD(s);
        const dt = new Date(p.y, p.m - 1, p.d + n);
        return toStr(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
      }
      function todayStr() {
        const t = new Date();
        return toStr(t.getFullYear(), t.getMonth() + 1, t.getDate());
      }
      function diffDays(a, b) {
        const pa = parseD(a),
          pb = parseD(b);
        return Math.round(
          (new Date(pb.y, pb.m - 1, pb.d) - new Date(pa.y, pa.m - 1, pa.d)) /
            86400000
        );
      }
      function wday(s) {
        const p = parseD(s);
        return "周" + "日一二三四五六"[new Date(p.y, p.m - 1, p.d).getDay()];
      }
      function fmtD(s) {
        return s.slice(5).replace("-", "/") + " " + wday(s);
      }
      function uid(p) {
        return (
          p +
          "-" +
          Date.now().toString(36) +
          "-" +
          Math.random().toString(36).slice(2, 7)
        );
      }
      function delay(ms) {
        return new Promise(function (r) {
          setTimeout(r, ms);
        });
      }
      function isDateStr(s) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return false;
        const p = parseD(s);
        const dt = new Date(p.y, p.m - 1, p.d);
        return (
          dt.getFullYear() === p.y &&
          dt.getMonth() === p.m - 1 &&
          dt.getDate() === p.d
        );
      }

      /* ================= 状态存储 ================= */
      const LS_KEY = "study-assistant-proto-v1";
      let state;
      function freshState() {
        return {
          appMeta: { initializedSeedVersion: SEED.seedVersion },
          settings: Object.assign({}, SEED.settings),
          resources: SEED.resources.map(function (r) {
            return Object.assign({}, r);
          }),
          planItems: SEED.planItems.map(function (p) {
            return Object.assign({}, p);
          }),
          studyLogs: [],
          usedDrafts: [],
        };
      }
      function save() {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(state));
        } catch (e) {}
      }
      function load() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) {
            const s = JSON.parse(raw);
            if (s && s.planItems) return s;
          }
        } catch (e) {}
        return freshState();
      }
      state = load();

      const ui = {
        page: "today",
        planDate: todayStr(),
        recordDate: todayStr(),
        modal: null,
        planAddOpen: false,
        planAdd: {
          date: null,
          subject: "综合知识",
          title: "",
          criteria: "",
          minutes: "",
          resourceId: "",
          err: {},
        },
        backfill: {
          date: null,
          mode: null,
          targetId: "",
          draftId: null,
          plan: {
            subject: "综合知识",
            title: "",
            criteria: "",
            minutes: "",
            resourceId: "",
          },
          log: { m: "", s: "", sc: "" },
          err: {},
          busy: false,
          fatal: null,
        },
        devOpen: false,
      };

      function itemById(id) {
        return state.planItems.find(function (p) {
          return p.id === id;
        });
      }
      function logOf(id) {
        return state.studyLogs.find(function (l) {
          return l.planItemId === id;
        });
      }
      function resById(id) {
        return state.resources.find(function (r) {
          return r.id === id;
        });
      }
      function itemsOfDate(d) {
        return state.planItems
          .filter(function (p) {
            return p.date === d;
          })
          .sort(function (a, b) {
            return a.order - b.order;
          });
      }
      function overdueItems() {
        const t = todayStr();
        return state.planItems
          .filter(function (p) {
            return p.date < t && p.status === "pending";
          })
          .sort(function (a, b) {
            return a.date < b.date
              ? -1
              : a.date > b.date
                ? 1
                : a.order - b.order;
          });
      }
      function todayBudget() {
        const t = todayStr();
        const x = state.planItems
          .filter(function (p) {
            return (
              p.date === t &&
              (p.status === "pending" || p.status === "completed")
            );
          })
          .reduce(function (s, p) {
            return s + p.plannedMinutes;
          }, 0);
        const y = state.settings.defaultDailyMinutes;
        return { x: x, y: y, over: x > y };
      }
      function isChainTail(p) {
        return state.planItems.some(function (q) {
          return q.movedToPlanItemId === p.id;
        });
      }
      function successorOf(p) {
        return p.movedToPlanItemId ? itemById(p.movedToPlanItemId) : null;
      }

      /* ================= 领域操作（模拟写事务：重读校验 → 原子写入） ================= */
      function validateLog(f) {
        const err = {};
        const m = parseInt(f.m, 10);
        if (!f.m || !Number.isInteger(m) || m <= 0)
          err.m = "实际分钟须为正整数";
        if (!f.s || !f.s.trim()) err.s = "总结不能为空";
        return err;
      }
      /* 完成：写事务内重读目标当前状态 */
      function opComplete(id, f) {
        const it = itemById(id);
        if (!it)
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason: "目标任务已不存在（可能在其他标签页被删除）",
          };
        if (it.status !== "pending")
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason:
              "该任务已变为「" +
              statusText(it.status) +
              "」，可能已在其他标签页处理",
          };
        if (logOf(id))
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason: "该任务已存在学习日志，不可重复完成",
          };
        const sib = state.planItems.filter(function (p) {
          return p.lineageId === it.lineageId && p.status === "pending";
        });
        if (sib.length !== 1 || sib[0].id !== id)
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason: "同一移动链出现了其他待处理项，操作放弃",
          };
        it.status = "completed";
        state.studyLogs.push({
          id: uid("log"),
          planItemId: id,
          date: it.date,
          actualMinutes: parseInt(f.m, 10),
          summary: f.s.trim(),
          scoreText: f.sc && f.sc.trim() ? f.sc.trim() : undefined,
        });
        return { ok: true };
      }
      /* 移动：仅 pending；同日零修改；同事务置 moved + 新建后继 */
      function opMove(id, target) {
        const it = itemById(id);
        if (!it)
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason: "目标任务已不存在",
          };
        if (it.status !== "pending")
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason:
              "该任务已变为「" +
              statusText(it.status) +
              "」，仅待处理任务可移动",
          };
        if (!isDateStr(target))
          return { ok: false, code: "INVALID_INPUT", reason: "目标日期不合法" };
        if (target === it.date) return { ok: true, noop: true };
        const nid = uid("mov");
        const maxOrder = state.planItems
          .filter(function (p) {
            return p.date === target;
          })
          .reduce(function (m, p) {
            return Math.max(m, p.order);
          }, -1);
        const succ = {
          id: nid,
          date: target,
          subject: it.subject,
          title: it.title,
          completionCriteria: it.completionCriteria,
          plannedMinutes: it.plannedMinutes,
          resourceId: it.resourceId,
          order: maxOrder + 1,
          status: "pending",
          lineageId: it.lineageId,
          source: it.source,
        };
        it.status = "moved";
        it.movedToPlanItemId = nid;
        state.planItems.push(succ);
        return { ok: true, target: target };
      }
      function opSkip(id) {
        const it = itemById(id);
        if (!it)
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason: "目标任务已不存在",
          };
        if (it.status !== "pending")
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason:
              "该任务已变为「" +
              statusText(it.status) +
              "」，仅待处理任务可跳过",
          };
        it.status = "skipped";
        return { ok: true };
      }
      function deleteReason(p) {
        if (p.status !== "pending")
          return "终态（" + statusText(p.status) + "）不可删除，仅保留历史";
        if (logOf(p.id)) return "已有学习日志，不可删除";
        if (isChainTail(p))
          return "移动链末端不可删除，只能完成、继续移动或跳过";
        return null;
      }
      function opDelete(id) {
        const it = itemById(id);
        if (!it)
          return {
            ok: false,
            code: "STATE_CHANGED",
            reason: "目标任务已不存在",
          };
        const r = deleteReason(it);
        if (r) return { ok: false, code: "INVALID_INPUT", reason: r };
        state.planItems = state.planItems.filter(function (p) {
          return p.id !== id;
        });
        return { ok: true };
      }
      function opAddPlan(f) {
        const err = {};
        if (!isDateStr(f.date)) err.date = "日期不合法";
        if (!f.title || !f.title.trim()) err.title = "标题不能为空";
        if (!f.criteria || !f.criteria.trim())
          err.criteria = "完成标准不能为空";
        const m = parseInt(f.minutes, 10);
        if (!f.minutes || !Number.isInteger(m) || m <= 0)
          err.minutes = "预计分钟须为正整数";
        if (f.resourceId && !resById(f.resourceId))
          err.resourceId = "资源不存在";
        if (Object.keys(err).length) return { ok: false, err: err };
        const maxOrder = state.planItems
          .filter(function (p) {
            return p.date === f.date;
          })
          .reduce(function (m2, p) {
            return Math.max(m2, p.order);
          }, -1);
        const id = uid("manual");
        state.planItems.push({
          id: id,
          date: f.date,
          subject: f.subject,
          title: f.title.trim(),
          completionCriteria: f.criteria.trim(),
          plannedMinutes: m,
          resourceId: f.resourceId || undefined,
          order: maxOrder + 1,
          status: "pending",
          lineageId: id,
          source: "manual",
        });
        return { ok: true };
      }
      function opReorder(id, dir) {
        const it = itemById(id);
        if (!it) return;
        const rows = itemsOfDate(it.date);
        const i = rows.findIndex(function (p) {
          return p.id === id;
        });
        const j = i + dir;
        if (j < 0 || j >= rows.length) return;
        const t = rows[i].order;
        rows[i].order = rows[j].order;
        rows[j].order = t;
      }
      function opEditLog(planItemId, f) {
        const l = logOf(planItemId);
        if (!l)
          return { ok: false, code: "STATE_CHANGED", reason: "日志已不存在" };
        l.actualMinutes = parseInt(f.m, 10);
        l.summary = f.s.trim();
        l.scoreText = f.sc && f.sc.trim() ? f.sc.trim() : undefined;
        return { ok: true };
      }
      /* 新建补录：固定草稿 ID 判重，任务+日志同次提交 */
      function opCreateBackfill(bf) {
        if (state.usedDrafts.indexOf(bf.draftId) >= 0)
          return {
            ok: false,
            code: "DUPLICATE_SUBMISSION",
            reason:
              "本次补录草稿已提交过（同一表单重复提交/失败重试沿用同一草稿），未重复创建任务与日志",
          };
        const err = {};
        const p = bf.plan,
          l = bf.log;
        if (!isDateStr(bf.date) || bf.date > todayStr())
          err.date = "补录日期须为今天或过去";
        if (!p.title || !p.title.trim()) err.title = "标题不能为空";
        if (!p.criteria || !p.criteria.trim())
          err.criteria =
            "完成标准不能为空（补建须如实提供，不用实际分钟冒充预计）";
        const pm = parseInt(p.minutes, 10);
        if (!p.minutes || !Number.isInteger(pm) || pm <= 0)
          err.minutes = "预计分钟须为正整数（当时确有计划的预计）";
        const am = parseInt(l.m, 10);
        if (!l.m || !Number.isInteger(am) || am <= 0)
          err.m = "实际分钟须为正整数";
        if (!l.s || !l.s.trim()) err.s = "总结不能为空";
        if (p.resourceId && !resById(p.resourceId))
          err.resourceId = "资源不存在";
        if (Object.keys(err).length) return { ok: false, err: err };
        const maxOrder = state.planItems
          .filter(function (x) {
            return x.date === bf.date;
          })
          .reduce(function (mm, x) {
            return Math.max(mm, x.order);
          }, -1);
        const id = uid("bf");
        state.planItems.push({
          id: id,
          date: bf.date,
          subject: p.subject,
          title: p.title.trim(),
          completionCriteria: p.criteria.trim(),
          plannedMinutes: pm,
          resourceId: p.resourceId || undefined,
          order: maxOrder + 1,
          status: "completed",
          lineageId: id,
          source: "backfill",
        });
        state.studyLogs.push({
          id: uid("log"),
          planItemId: id,
          date: bf.date,
          actualMinutes: am,
          summary: l.s.trim(),
          scoreText: l.sc && l.sc.trim() ? l.sc.trim() : undefined,
        });
        state.usedDrafts.push(bf.draftId);
        return { ok: true };
      }
      function statusText(st) {
        return (
          {
            pending: "待处理",
            completed: "已完成",
            moved: "已移动",
            skipped: "已跳过",
          }[st] || st
        );
      }

      /* ================= 备份 ================= */
      const SUPPORTED_SCHEMA = 1;
      const SUPPORTED_SEEDS = ["sysanalyst-2026-09-06.v1"];
      function buildExport() {
        /* 契约：五部分必须来自覆盖全部数据表的同一只读事务快照（原型为单次内存读取） */
        const snap = JSON.stringify({
          appMeta: state.appMeta,
          settings: state.settings,
          resources: state.resources,
          planItems: state.planItems,
          studyLogs: state.studyLogs,
        });
        const c = JSON.parse(snap);
        return {
          schemaVersion: SUPPORTED_SCHEMA,
          exportedAt: new Date().toISOString(),
          appMeta: c.appMeta,
          settings: c.settings,
          resources: c.resources,
          planItems: c.planItems,
          studyLogs: c.studyLogs,
        };
      }
      function validateBackup(d) {
        const errs = [];
        if (!d || typeof d !== "object" || Array.isArray(d))
          return ["备份不是合法的 JSON 对象"];
        if (d.schemaVersion !== SUPPORTED_SCHEMA)
          errs.push(
            "schemaVersion 不受支持：" +
              JSON.stringify(d.schemaVersion) +
              "（当前支持 " +
              SUPPORTED_SCHEMA +
              "）"
          );
        const sv = d.appMeta && d.appMeta.initializedSeedVersion;
        if (!sv) errs.push("appMeta.initializedSeedVersion 为空");
        else if (SUPPORTED_SEEDS.indexOf(sv) < 0)
          errs.push("initializedSeedVersion 不在兼容列表：" + sv);
        if (!d.settings || !isDateStr(d.settings.examDate))
          errs.push("settings.examDate 缺失或不合法");
        if (
          !d.settings ||
          !Number.isInteger(d.settings.defaultDailyMinutes) ||
          d.settings.defaultDailyMinutes <= 0
        )
          errs.push("settings.defaultDailyMinutes 须为正整数");
        if (
          !Array.isArray(d.resources) ||
          !Array.isArray(d.planItems) ||
          !Array.isArray(d.studyLogs)
        ) {
          errs.push("resources / planItems / studyLogs 必须为数组");
          return errs;
        }
        const rids = new Set(),
          pids = new Set();
        d.resources.forEach(function (r, i) {
          if (!r.id) errs.push("资源 #" + i + " 缺少 id");
          if (rids.has(r.id)) errs.push("资源 id 重复：" + r.id);
          rids.add(r.id);
          const web = r.type === "web" && /^https?:\/\//.test(r.url || ""),
            file = r.type === "local-file" && !!r.filename;
          if (web === file)
            errs.push(
              "资源「" +
                (r.title || r.id) +
                "」类型与字段不匹配（web 必须有 http(s) url；local-file 必须有 filename，二者互斥）"
            );
        });
        d.planItems.forEach(function (p) {
          if (!p.id) errs.push("计划项缺少 id");
          if (pids.has(p.id)) errs.push("计划项 id 重复：" + p.id);
          pids.add(p.id);
          if (!isDateStr(p.date)) errs.push("计划项 " + p.id + " 日期不合法");
          if (
            ["pending", "completed", "skipped", "moved"].indexOf(p.status) < 0
          )
            errs.push("计划项 " + p.id + " status 非法：" + p.status);
          if (["seed", "manual", "backfill"].indexOf(p.source) < 0)
            errs.push("计划项 " + p.id + " source 非法：" + p.source);
          if (!Number.isInteger(p.plannedMinutes) || p.plannedMinutes <= 0)
            errs.push("计划项 " + p.id + " plannedMinutes 须为正整数");
          if (!p.completionCriteria || !String(p.completionCriteria).trim())
            errs.push("计划项 " + p.id + " completionCriteria 为空");
          if (p.resourceId && !rids.has(p.resourceId))
            errs.push("计划项 " + p.id + " 引用了不存在的资源 " + p.resourceId);
        });
        const logByPlan = {};
        d.studyLogs.forEach(function (l) {
          if (!pids.has(l.planItemId)) {
            errs.push("日志 " + l.id + " 引用了不存在的计划项 " + l.planItemId);
            return;
          }
          if (logByPlan[l.planItemId])
            errs.push("计划项 " + l.planItemId + " 存在多条日志");
          logByPlan[l.planItemId] = l;
          if (!Number.isInteger(l.actualMinutes) || l.actualMinutes <= 0)
            errs.push("日志 " + l.id + " actualMinutes 须为正整数");
          if (!l.summary || !String(l.summary).trim())
            errs.push("日志 " + l.id + " summary 为空");
        });
        d.planItems.forEach(function (p) {
          const l = logByPlan[p.id];
          if (p.status === "completed" && !l)
            errs.push("completed 项缺少学习日志：" + p.id);
          if (p.status !== "completed" && l)
            errs.push("非 completed 项存在学习日志：" + p.id);
          if (l && l.date !== p.date)
            errs.push(
              "日志日期与计划日期不一致：" +
                p.id +
                "（" +
                l.date +
                " ≠ " +
                p.date +
                "）"
            );
        });
        /* lineage 不变量 */
        const byLine = {};
        d.planItems.forEach(function (p) {
          (byLine[p.lineageId] = byLine[p.lineageId] || []).push(p);
        });
        Object.keys(byLine).forEach(function (lid) {
          const nodes = byLine[lid];
          if (
            nodes.filter(function (p) {
              return p.status === "pending";
            }).length > 1
          )
            errs.push("lineage " + lid + " 存在多个 pending");
          const roots = nodes.filter(function (p) {
            return !nodes.some(function (q) {
              return q.movedToPlanItemId === p.id;
            });
          });
          if (roots.length !== 1)
            errs.push("lineage " + lid + " 根节点数量异常：" + roots.length);
          else if (roots[0].id !== lid)
            errs.push("lineage " + lid + " 的 lineageId 不等于根 id");
          nodes.forEach(function (p) {
            if (
              p.status === "moved" &&
              (!p.movedToPlanItemId || !pids.has(p.movedToPlanItemId))
            )
              errs.push("moved 项 " + p.id + " 缺少有效后继引用");
            if (p.status !== "moved" && p.movedToPlanItemId)
              errs.push("非 moved 项 " + p.id + " 携带 movedToPlanItemId");
            if (p.movedToPlanItemId) {
              const s = d.planItems.find(function (q) {
                return q.id === p.movedToPlanItemId;
              });
              if (s && s.lineageId !== lid)
                errs.push("移动后继跨 lineage：" + p.id);
            }
          });
          /* 环检测：从根沿 movedToPlanItemId 走 */
          if (roots.length === 1) {
            let cur = roots[0],
              seen = new Set([cur.id]);
            while (cur.movedToPlanItemId) {
              const nx = d.planItems.find(function (q) {
                return q.id === cur.movedToPlanItemId;
              });
              if (!nx) break;
              if (seen.has(nx.id)) {
                errs.push("lineage " + lid + " 存在环");
                break;
              }
              seen.add(nx.id);
              cur = nx;
            }
          }
        });
        return errs;
      }

      /* ================= 渲染：历史 ================= */
      function renderHistory() {
        let h = '<div data-screen-label="history">';
        const dates = {};
        state.planItems.forEach(function (p) {
          (dates[p.date] = dates[p.date] || []).push(p);
        });
        const t = todayStr();
        const allKeys = Object.keys(dates).sort().reverse();
        const pastKeys = allKeys.filter(function (d) {
          return d <= t;
        });
        const futureCount = allKeys.length - pastKeys.length;
        const keys = ui.histShowFuture ? allKeys : pastKeys;
        h +=
          '<div class="page-head"><h1>历史</h1><span class="sub">计划与实际对比；移动显示绝对目标日期；补建项标「补录」</span><span class="spacer"></span>' +
          (futureCount
            ? '<button class="btn" data-act="hist-future">' +
              (ui.histShowFuture
                ? "收起未来日期"
                : "显示未来 " + futureCount + " 天计划") +
              "</button>"
            : "") +
          "</div>";
        const shownChains = {};
        keys.forEach(function (d) {
          const rows = dates[d].sort(function (a, b) {
            return a.order - b.order;
          });
          const planned = rows.reduce(function (s, p) {
            return s + p.plannedMinutes;
          }, 0);
          const actual = rows.reduce(function (s, p) {
            const l = logOf(p.id);
            return s + (l ? l.actualMinutes : 0);
          }, 0);
          h +=
            '<div class="hday"><div class="hd"><span class="d">' +
            d +
            " " +
            wday(d) +
            "</span>" +
            (d === t ? '<span class="chip st-overdue">今天</span>' : "") +
            '<span class="s">计划 ' +
            planned +
            " 分钟" +
            (actual ? " · 实际 " + actual + " 分钟" : "") +
            " · " +
            rows.length +
            " 项</span></div>";
          h += '<div class="card" style="margin-bottom:0">';
          rows.forEach(function (p) {
            h += taskRow(p, { actions: "none", showLog: true, hideCrit: true });
          });
          h += "</div>";
          /* 移动链摘要（PROTO-01）：挂在链末端所在日期 */
          rows.forEach(function (p) {
            const chain = state.planItems.filter(function (q) {
              return q.lineageId === p.lineageId;
            });
            const hasMoved = chain.some(function (q) {
              return q.status === "moved";
            });
            const tail = chain.find(function (q) {
              return q.status !== "moved";
            });
            if (
              hasMoved &&
              tail &&
              tail.id === p.id &&
              !shownChains[p.lineageId]
            ) {
              shownChains[p.lineageId] = 1;
              const root =
                chain.find(function (q) {
                  return q.id === q.lineageId;
                }) || chain[0];
              const moves = chain.filter(function (q) {
                return q.status === "moved";
              }).length;
              const path = chain
                .slice()
                .sort(function (a, b) {
                  return a.date < b.date ? -1 : 1;
                })
                .map(function (q) {
                  return fmtD(q.date);
                })
                .join(" → ");
              h +=
                '<div class="chain-sum">' +
                ic("history", 12) +
                "<span><b>移动链</b>：原计划日 " +
                root.date +
                " ｜ " +
                path +
                " ｜ 最终：" +
                tail.date +
                " " +
                statusText(tail.status) +
                " ｜ 改期 " +
                moves +
                " 次 ｜ 本链待处理 " +
                chain.filter(function (q) {
                  return q.status === "pending";
                }).length +
                " 项</span></div>";
            }
          });
          h += "</div>";
        });
        h += "</div>";
        return h;
      }

            "<span>以下为各流程在原型中已呈现的界面状态。票据归属为<b>建议</b>，按实施顺序「今日与记录闭环 → 计划增删排序 → 历史与资源 → 导出导入与部署」拆票，归属与契约在每票实施前细化确认（引用 FLOW-01-C/R/L 与需求 §3）。</span></div>" +
            '<table class="inv-table"><tr><th>流程域</th><th>界面状态与反馈（原型可逐项点验）</th><th>建议票据归属</th></tr>' +
            '<tr><td><b>今日闭环</b></td><td><ul class="st-list"><li>逾期区三入口（移今天/明天/跳过）与计数徽标</li><li>完成对话框：校验失败内联、提交中禁用、重复点击无效、STATE_CHANGED 过期横幅保留输入</li><li>预算 X/Y 与超预算提示、倒计时、空态</li></ul></td><td class="tk">票② 今日与记录闭环（前置：票① 最小脚手架）</td></tr>' +
            '<tr><td><b>记录 / 补录</b></td><td><ul class="st-list"><li>补记：选历史 pending 只填日志，日志日期=计划日</li><li>新建补录：无对应任务才显示字段；DUPLICATE_SUBMISSION 拒绝</li><li>日志编辑三字段、终态只读说明、无删除入口</li><li>补记 vs 补做口径说明</li></ul></td><td class="tk">票② 今日与记录闭环</td></tr>' +
            '<tr><td><b>计划增删排序</b></td><td><ul class="st-list"><li>添加表单逐字段校验失败</li><li>上移/下移即时生效</li><li>删除禁用原因提示（终态/有日志/链末端）</li><li>跳过/删除二次确认、过期重读放弃</li><li>移动同日零修改提示</li></ul></td><td class="tk">票③ 计划增删排序与移动/跳过/删除</td></tr>' +
            '<tr><td><b>设置</b></td><td><ul class="st-list"><li>保存成功、非法输入拒绝</li><li>「仅影响展示」固定说明</li></ul></td><td class="tk">票③（随计划页）</td></tr>' +
            '<tr><td><b>历史</b></td><td><ul class="st-list"><li>四状态徽标、「已移至 YYYY-MM-DD」绝对日期</li><li>移动链摘要行（原计划日｜最终｜改期次数｜待处理数）</li><li>backfill 徽标、计划/实际分钟汇总、空日不列</li></ul></td><td class="tk">票④ 历史与资源</td></tr>' +
            '<tr><td><b>资源</b></td><td><ul class="st-list"><li>网页新标签打开</li><li>复制成功 toast / 剪贴板不可用时错误态</li></ul></td><td class="tk">票④ 历史与资源</td></tr>' +
            '<tr><td><b>备份</b></td><td><ul class="st-list"><li>导出：一致快照契约说明（同一只读事务）</li><li>导入：解析失败/字段/引用/日志/lineage 不变量失败清单，零修改</li><li>确认替换对话框、取消零修改</li></ul></td><td class="tk">票⑤ 导出导入与部署（FMT-01 schemaVersion 生产值实施前确认）</td></tr>' +
            '</table></div><div class="m-foot"><button class="btn btn-pri" data-act="modal-close">关闭</button></div>';
        }
        root.innerHTML =
          '<div class="overlay" data-act="overlay"><div class="modal' +
          (m.type === "inventory" ? " wide" : "") +
          '" role="dialog" aria-modal="true">' +
          body +
          "</div></div>";
        const first = root.querySelector("input,textarea,select");
        if (first && !m.busy) first.focus();
        renderDev();
      }

      /* ================= 渲染：演示面板 ================= */
      function renderDev() {
        const p = document.getElementById("dev-panel");
        p.className = ui.devOpen ? "open" : "";
        if (!ui.devOpen) return;
        const canSim = ui.modal && ui.modal.type === "complete";
        const canDupe =
          ui.page === "record" &&
          ui.backfill.mode === "new" &&
          ui.backfill.draftId;
        p.innerHTML =
          '<h3>演示工具（非产品功能）</h3><div class="dnote">用于点验并发/失败反馈。生产对应：写事务内重读状态、固定提交标识判重、导入完整校验。</div>' +
          '<button class="btn" data-act="dev-reset">' +
          ic("refresh-ccw", 13) +
          "重置为种子初始数据</button>" +
          '<button class="btn" data-act="dev-sim-complete" ' +
          (canSim ? "" : "disabled") +
          ">" +
          ic("alert-triangle", 13) +
          "模拟另一标签页完成当前任务</button>" +
          '<button class="btn" data-act="dev-sim-dupe" ' +
          (canDupe ? "" : "disabled") +
          ">" +
          ic("copy", 13) +
          "模拟该补录草稿已在别处提交</button>" +
          '<button class="btn" data-act="dev-bad-backup">' +
          ic("download", 13) +
          "下载非法备份样例（供导入失败态）</button>" +
          '<div class="dnote">用法：打开「完成」对话框 → 点第二条 → 再点「确认完成」，可见 STATE_CHANGED；新建补录时先点第三条 → 再提交，可见 DUPLICATE_SUBMISSION。</div>';
      }

      /* ================= 主渲染 ================= */
      function render() {
        renderSidebar();
        const v = document.getElementById("view");
        if (ui.page === "today") v.innerHTML = renderToday();
        else if (ui.page === "plan") v.innerHTML = renderPlan();
        else if (ui.page === "record") v.innerHTML = renderRecord();
        else if (ui.page === "history") v.innerHTML = renderHistory();
        else if (ui.page === "resources") v.innerHTML = renderResources();
        renderDev();
      }
      function rerenderAll() {
        save();
        render();
        renderModal();
      }

      /* ================= 事件 ================= */
      document.addEventListener("click", function (e) {
        const ov = e.target.classList && e.target.classList.contains("overlay");
        if (ov && ui.modal && !ui.modal.busy) {
          ui.modal = null;
          renderModal();
          return;
        }
        const el = e.target.closest("[data-act]");
        if (!el || el.disabled) return;
        const act = el.dataset.act,
          id = el.dataset.id;

        if (act === "nav") {
          ui.page = el.dataset.page;
          render();
        } else if (act === "dev-toggle") {
          ui.devOpen = !ui.devOpen;
          renderDev();
        } else if (act === "open-inventory") {
          ui.modal = { type: "inventory" };
          renderModal();
        } else if (act === "modal-close") {
          if (ui.modal && !ui.modal.busy) {
            ui.modal = null;
            renderModal();
          }
        } else if (act === "complete-open") {
          const p = itemById(id);
          if (!p) return;
          ui.modal = {
            type: "complete",
            id: id,
            f: { m: String(p.plannedMinutes), s: "", sc: "" },
            err: {},
            busy: false,
            fatal: null,
          };
          renderModal();
        } else if (act === "complete-submit") {
          submitComplete();
        } else if (act === "move-open") {
          ui.modal = {
            type: "move",
            id: id,
            mode: "tomorrow",
            date: addDays(todayStr(), 1),
            busy: false,
            fatal: null,
          };
          renderModal();
        } else if (act === "move-quick") {
          doMove(
            id,
            el.dataset.to === "today" ? todayStr() : addDays(todayStr(), 1)
          );
        } else if (act === "move-submit") {
          const m = ui.modal;
          if (!m || m.busy) return;
          const sel = document.querySelector("input[name=mv]:checked");
          const mode = sel ? sel.value : m.mode;
          const target =
            mode === "today"
              ? todayStr()
              : mode === "tomorrow"
                ? addDays(todayStr(), 1)
                : m.date;
          doMove(m.id, target, true);
        } else if (act === "skip-open") {
          const p = itemById(id);
          if (!p) return;
          ui.modal = {
            type: "confirm",
            kind: "skip",
            id: id,
            title: "跳过任务",
            danger: true,
            okText: "确认跳过",
            text:
              "将「" +
              esc(p.title) +
              "」置为已跳过（终态，保留历史，不可删除、不可恢复为待处理）。",
            busy: false,
            fatal: null,
          };
          renderModal();
        } else if (act === "delete-open") {
          const p = itemById(id);
          if (!p) return;
          ui.modal = {
            type: "confirm",
            kind: "delete",
            id: id,
            title: "删除任务",
            danger: true,
            okText: "永久删除",
            text:
              "永久删除「" +
              esc(p.title) +
              "」，不可恢复。仅无记录、未被移动链引用的待处理项可删除。",
            busy: false,
            fatal: null,
          };
          renderModal();
        } else if (act === "confirm-yes") {
          const m = ui.modal;
          if (!m || m.busy) return;
          m.busy = true;
          renderModal();
          delay(500).then(function () {
            const res = m.kind === "skip" ? opSkip(m.id) : opDelete(m.id);
            if (res.ok) {
              ui.modal = null;
              rerenderAll();
              toast(m.kind === "skip" ? "已跳过，历史页可见" : "已永久删除");
            } else {
              m.busy = false;
              m.fatal = res.reason;
              renderModal();
            }
          });
        } else if (act === "logedit-open") {
          const l = logOf(id);
          if (!l) return;
          ui.modal = {
            type: "logedit",
            id: id,
            f: {
              m: String(l.actualMinutes),
              s: l.summary,
              sc: l.scoreText || "",
            },
            err: {},
            busy: false,
          };
          renderModal();
        } else if (act === "logedit-submit") {
          const m = ui.modal;
          if (!m || m.busy) return;
          m.err = validateLog(m.f);
          if (Object.keys(m.err).length) {
            renderModal();
            return;
          }
          m.busy = true;
          renderModal();
          delay(450).then(function () {
            const res = opEditLog(m.id, m.f);
            if (res.ok) {
              ui.modal = null;
              rerenderAll();
              toast("日志已更新（任务完成状态与日期不变）");
            } else {
              ui.modal = null;
              rerenderAll();
              toast(res.reason, "err");
            }
          });
        } else if (act === "reorder") {
          opReorder(id, parseInt(el.dataset.dir, 10));
          rerenderAll();
        } else if (act === "plan-prev") {
          ui.planDate = addDays(ui.planDate, -1);
          render();
        } else if (act === "plan-next") {
          ui.planDate = addDays(ui.planDate, 1);
          render();
        } else if (act === "plan-today") {
          ui.planDate = todayStr();
          render();
        } else if (act === "hist-future") {
          ui.histShowFuture = !ui.histShowFuture;
          render();
        } else if (act === "plan-add-toggle") {
          ui.planAddOpen = !ui.planAddOpen;
          if (ui.planAddOpen)
            ui.planAdd = {
              date: ui.planDate,
              subject: "综合知识",
              title: "",
              criteria: "",
              minutes: "",
              resourceId: "",
              err: {},
            };
          render();
        } else if (act === "plan-add-submit") {
          const res = opAddPlan(ui.planAdd);
          if (!res.ok) {
            ui.planAdd.err = res.err;
            render();
            return;
          }
          ui.planAddOpen = false;
          rerenderAll();
          toast("已添加任务（manual 根）");
        } else if (act === "settings-save") {
          const ex = document.getElementById("set-exam").value;
          const mn = parseInt(document.getElementById("set-min").value, 10);
          if (!isDateStr(ex)) {
            toast("考试日期不合法", "err");
            return;
          }
          if (!Number.isInteger(mn) || mn <= 0) {
            toast("默认每日分钟须为正整数", "err");
            return;
          }
          state.settings.examDate = ex;
          state.settings.defaultDailyMinutes = mn;
          rerenderAll();
          toast("设置已保存（仅影响显示，不改动计划）");
        } else if (act === "bf-complete") {
          const bf = ui.backfill;
          if (bf.busy) return;
          bf.err = validateLog(bf.log);
          if (Object.keys(bf.err).length) {
            render();
            return;
          }
          bf.busy = true;
          render();
          delay(550).then(function () {
            const res = opComplete(bf.targetId, bf.log);
            bf.busy = false;
            if (res.ok) {
              ui.backfill = {
                date: null,
                mode: null,
                targetId: "",
                draftId: null,
                plan: {
                  subject: "综合知识",
                  title: "",
                  criteria: "",
                  minutes: "",
                  resourceId: "",
                },
                log: { m: "", s: "", sc: "" },
                err: {},
                busy: false,
                fatal: null,
              };
              rerenderAll();
              toast("补记完成：任务置为已完成，日志留在计划日");
            } else {
              ui.backfill.fatal = res.reason;
              ui.backfill.err = {};
              render();
            }
          });
        } else if (act === "bf-create") {
          const bf = ui.backfill;
          if (bf.busy) return;
          bf.busy = true;
          render();
          delay(650).then(function () {
            const res = opCreateBackfill(bf);
            bf.busy = false;
            if (res.ok) {
              ui.backfill = {
                date: null,
                mode: null,
                targetId: "",
                draftId: null,
                plan: {
                  subject: "综合知识",
                  title: "",
                  criteria: "",
                  minutes: "",
                  resourceId: "",
                },
                log: { m: "", s: "", sc: "" },
                err: {},
                busy: false,
                fatal: null,
              };
              rerenderAll();
              toast("已创建补录项并完成（source=backfill，历史页可区分）");
            } else if (res.err) {
              ui.backfill.err = res.err;
              render();
            } else {
              ui.backfill.fatal = res.reason;
              ui.backfill.err = {};
              render();
            }
          });
        } else if (act === "copy-res") {
          const r = resById(id);
          if (!r) return;
          const text = r.type === "local-file" ? r.filename : r.title;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              function () {
                toast("已复制文件名：" + text);
              },
              function () {
                toast("复制失败：浏览器拒绝剪贴板访问，请手动复制", "err");
              }
            );
          } else {
            toast("复制失败：当前环境不支持剪贴板 API，请手动复制", "err");
          }
        } else if (act === "export") {
          const data = buildExport();
          const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "study-backup-" + todayStr() + ".json";
          a.click();
          URL.revokeObjectURL(a.href);
          toast("已导出一致快照（AppMeta/设置/资源/计划/日志，同一次读取）");
        } else if (act === "import-trigger") {
          document.getElementById("import-file").click();
        } else if (act === "import-yes") {
          const m = ui.modal;
          if (!m) return;
          const d = m.data;
          state = {
            appMeta: d.appMeta,
            settings: d.settings,
            resources: d.resources,
            planItems: d.planItems,
            studyLogs: d.studyLogs,
            usedDrafts: [],
          };
          ui.modal = null;
          ui.backfill.draftId = null;
          rerenderAll();
          toast("已原子完整替换全部数据（含 AppMeta）");
        } else if (act === "dev-reset") {
          state = freshState();
          ui.modal = null;
          ui.backfill.draftId = null;
          rerenderAll();
          toast("已重置为种子初始数据", "info");
        } else if (act === "dev-sim-complete") {
          const m = ui.modal;
          if (!m || m.type !== "complete") return;
          const p = itemById(m.id);
          if (!p || p.status !== "pending") {
            toast("该任务已不是待处理", "info");
            return;
          }
          p.status = "completed";
          state.studyLogs.push({
            id: uid("log"),
            planItemId: p.id,
            date: p.date,
            actualMinutes: p.plannedMinutes,
            summary: "（模拟）在另一个标签页完成的记录",
          });
          save();
          render();
          renderModal();
          toast("已模拟另一标签页完成该任务；现在提交当前表单试试", "info");
        } else if (act === "dev-sim-dupe") {
          if (!ui.backfill.draftId) return;
          state.usedDrafts.push(ui.backfill.draftId);
          save();
          toast(
            "已模拟该补录草稿在别处提交；现在点「创建补录项并完成」试试",
            "info"
          );
        } else if (act === "dev-bad-backup") {
          const d = buildExport();
          let victim = d.planItems.find(function (p) {
            return p.status === "completed";
          });
          if (victim) {
            d.studyLogs = d.studyLogs.filter(function (l) {
              return l.planItemId !== victim.id;
            });
          } else {
            victim = d.planItems[0];
            victim.status = "completed";
          }
          const dup = JSON.parse(JSON.stringify(d.planItems[1]));
          dup.id = dup.id + "-fork";
          dup.status = "pending";
          d.planItems.push(
            dup
          ); /* 同 lineage 双 pending + moved 无有效后继之外的违例 */
          const blob = new Blob([JSON.stringify(d, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "backup-illegal-sample.json";
          a.click();
          URL.revokeObjectURL(a.href);
          toast(
            "已下载非法备份样例（completed 无日志 / 同链双 pending）",
            "info"
          );
        }
      });

      /* 完成提交（写事务内重读状态） */
      function submitComplete() {
        const m = ui.modal;
        if (!m || m.busy || m.type !== "complete") return;
        m.err = validateLog(m.f);
        if (Object.keys(m.err).length) {
          renderModal();
          return;
        }
        m.busy = true;
        renderModal();
        delay(600).then(function () {
          const res = opComplete(m.id, m.f);
          if (res.ok) {
            ui.modal = null;
            rerenderAll();
            toast("已完成：日志与完成状态同一事务写入");
          } else {
            m.busy = false;
            m.fatal = res.reason;
            renderModal();
          }
        });
      }
      function doMove(id, target, fromModal) {
        const m = ui.modal;
        const apply = function () {
          const res = opMove(id, target);
          if (res.ok && res.noop) {
            if (fromModal) {
              ui.modal = null;
              renderModal();
            }
            rerenderAll();
            toast("目标日期与原日期相同，未产生任何变更", "info");
          } else if (res.ok) {
            if (fromModal) ui.modal = null;
            rerenderAll();
            toast(
              "已移至 " + target + "（原项保留为「已移至 " + target + "」）"
            );
          } else if (fromModal) {
            m.busy = false;
            m.fatal = res.reason;
            renderModal();
          } else {
            rerenderAll();
            toast(res.reason, "err");
          }
        };
        if (fromModal) {
          m.busy = true;
          renderModal();
          delay(500).then(apply);
        } else {
          delay(0).then(apply);
        }
      }

      /* 输入/变更委托 */
      document.addEventListener("input", function (e) {
        const t = e.target;
        if (t.dataset.mf && ui.modal && ui.modal.f) {
          ui.modal.f[t.dataset.mf] = t.value;
        } else if (t.dataset.pf) {
          ui.planAdd[t.dataset.pf] = t.value;
        } else if (t.dataset.bfp) {
          ui.backfill.plan[t.dataset.bfp] = t.value;
        } else if (t.hasAttribute("data-bf-l")) {
          ui.backfill.log[t.getAttribute("data-bf-l")] = t.value;
        } else if (
          t.dataset.mvDate !== undefined &&
          ui.modal &&
          ui.modal.type === "move"
        ) {
          ui.modal.date = t.value;
          ui.modal.mode = "custom";
        }
      });
      document.addEventListener("change", function (e) {
        const t = e.target;
        if (t.dataset.change === "plan-date" && isDateStr(t.value)) {
          ui.planDate = t.value;
          render();
        } else if (t.dataset.change === "record-date" && isDateStr(t.value)) {
          ui.recordDate = t.value;
          render();
        } else if (t.dataset.change === "bf-date") {
          ui.backfill.date = t.value;
          ui.backfill.mode = null;
          ui.backfill.targetId = "";
          ui.backfill.draftId = uid("draft");
          ui.backfill.err = {};
          ui.backfill.fatal = null;
          const pend = itemsOfDate(t.value).filter(function (p) {
            return p.status === "pending";
          });
          if (pend.length) {
            ui.backfill.mode = "pending";
            ui.backfill.targetId = pend[0].id;
          } else {
            ui.backfill.mode = "new";
          }
          render();
        } else if (t.dataset.bft) {
          if (t.dataset.bft === "__new__") {
            ui.backfill.mode = "new";
            ui.backfill.targetId = "";
          } else {
            ui.backfill.mode = "pending";
            ui.backfill.targetId = t.dataset.bft;
          }
          render();
        } else if (t.name === "mv" && ui.modal && ui.modal.type === "move") {
          ui.modal.mode = t.value;
          renderModal();
        } else if (t.id === "import-file") {
          const file = t.files[0];
          t.value = "";
          if (!file) return;
          const rd = new FileReader();
          rd.onload = function () {
            let data,
              errs = [];
            try {
              data = JSON.parse(rd.result);
            } catch (ex) {
              ui.modal = {
                type: "import-fail",
                name: file.name,
                errors: ["JSON 解析失败：" + ex.message],
              };
              renderModal();
              return;
            }
            errs = validateBackup(data);
            if (errs.length) {
              ui.modal = { type: "import-fail", name: file.name, errors: errs };
            } else {
              ui.modal = {
                type: "import-confirm",
                name: file.name,
                data: data,
              };
            }
            renderModal();
          };
          rd.readAsText(file);
        } else if (t.dataset.pf) {
          ui.planAdd[t.dataset.pf] = t.value;
        } else if (t.dataset.bfp) {
          ui.backfill.plan[t.dataset.bfp] = t.value;
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && ui.modal && !ui.modal.busy) {
          ui.modal = null;
          renderModal();
        }
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && ui.modal) {
          if (ui.modal.type === "complete") submitComplete();
        }
      });

      render();
    </script>
  </body>
</html>
